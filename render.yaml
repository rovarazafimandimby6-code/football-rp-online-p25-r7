services:
  - type: web
    name: football-rp-online-p27-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: p27-player-world-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: P27_ADMIN_TOKEN
        generateValue: true
      - key: RESULTS_DIR
        value: /var/data/results
      - key: CAREERS_DIR
        value: /var/data/careers
      - key: PLAYER_PROGRESSION_DIR
        value: /var/data/progression
      - key: PLAYER_PROFILES_DIR
        value: /var/data/player-profiles
      - key: COMPETITIONS_DIR
        value: /var/data/competitions
      - key: TRANSFERS_DIR
        value: /var/data/transfers
      - key: FINANCES_DIR
        value: /var/data/finances
      - key: CLUB_ROSTERS_DIR
        value: /var/data/club-rosters
      - key: SYSTEM_TRANSFERS_DIR
        value: /var/data/system-transfers
      - key: ROOMS_DIR
        value: /var/data/rooms
      - key: ACCOUNTS_DIR
        value: /var/data/accounts
      - key: PLAYER_IDENTITIES_DIR
        value: /var/data/player-identities
      - key: GOOGLE_OIDC_TRANSACTIONS_DIR
        value: /var/data/google-oidc-transactions
      - key: GOOGLE_IDENTITIES_DIR
        value: /var/data/google-identities
      - key: P27_BACKUPS_DIR
        value: /var/data/backups
