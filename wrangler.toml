# Local Cloudflare migration scaffold only.
# Replace database_id only after the owner creates the D1 database in their account.
# No Cloudflare resource is created or deployed by this file.
# Configure the server-only HMAC key with: wrangler secret put P27_MATCH_INGEST_SECRET

name = "football-rp-online-p27-api"
main = "src/cloudflare/worker.js"
compatibility_date = "2026-11-25"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "P27_DB"
database_name = "p27-world"
database_id = "9f243d33-8053-45c2-9a77-0e8dc3f5a5d0"
migrations_dir = "migrations/d1"
