
name: Prepare Render Deployment

'on':
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download P25 R7 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v25-r7 \
            --repo rovarazafimandimby6-code/football-rp-online-p25-r7 \
            --pattern "Football-RP-Online-P25-R7.zip"

      - name: Extract project
        run: |
          unzip Football-RP-Online-P25-R7.zip -d unpacked

          PROJECT_DIR="$(dirname "$(find unpacked -type f -name package.json -not -path '*/node_modules/*' -print -quit)")"

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "Projet Node.js introuvable"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare deployment branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --orphan render-deploy
          git rm -rf . || true

          rsync -a \
            --exclude='.git/' \
            --exclude='node_modules/' \
            "$PROJECT_DIR/" ./

          git add -A

          if git diff --cached --quiet; then
            echo "Aucun fichier à publier"
            exit 1
          fi

          git commit -m "Prepare P25 R7 for Render deployment"
          git push origin HEAD:render-deploy --force

      - name: Verify deployment branch
        run: |
          echo "Branche render-deploy publiée."
          git status --short
          
