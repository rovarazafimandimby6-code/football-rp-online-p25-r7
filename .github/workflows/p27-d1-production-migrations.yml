name: P27 production D1 migrations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p27-production-d1-migrations
  cancel-in-progress: false

jobs:
  apply-migrations:
    name: Apply versioned migrations to p27-world
    if: github.ref == 'refs/heads/p27-dls26-global-adaptation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the approved P27 branch
        uses: actions/checkout@v4
        with:
          ref: p27-dls26-global-adaptation

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify target database configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          grep -F 'database_name = "p27-world"' wrangler.toml
          grep -F 'database_id = "9f243d33-8053-45c2-9a77-0e8dc3f5a5d0"' wrangler.toml
          grep -F 'migrations_dir = "migrations/d1"' wrangler.toml

      - name: List pending production migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.169.0 d1 migrations list p27-world --remote --config wrangler.toml

      - name: Apply pending production migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.169.0 d1 migrations apply p27-world --remote --config wrangler.toml

      - name: Verify migration history and foreign keys
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.169.0 d1 migrations list p27-world --remote --config wrangler.toml
          npx --yes wrangler@4.169.0 d1 execute p27-world --remote --config wrangler.toml --command "PRAGMA foreign_key_check;"
