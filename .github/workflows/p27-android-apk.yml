name: P27 Android test APK

on:
  push:
    branches: [p27-dev, p27-apk-build, p27-dls-inspired-redesign, p27-home-navigation-refit, p27-dls19-ui-rebuild, p27-dls26-global-adaptation]
  pull_request:
    branches: [p27-dev, p27-dls-inspired-redesign]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build offline Android test APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout P27 development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK platform and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Run P27 automated tests
        run: npm test
      - name: Bundle the game and local 3D assets
        run: npm run build
      - name: Generate the Android project
        run: npx cap add android
      - name: Synchronize bundled web application
        run: npx cap sync android
      - name: Enforce native landscape and immersive edge-to-edge fullscreen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest_path = Path('android/app/src/main/AndroidManifest.xml')
          manifest = manifest_path.read_text()
          match = re.search(r'<activity\b[^>]*>', manifest)
          if not match:
              raise SystemExit('Android launcher activity not found in manifest.')
          activity = match.group(0)
          if 'android:screenOrientation=' in activity:
              activity = re.sub(r'android:screenOrientation="[^"]+"', 'android:screenOrientation="landscape"', activity)
          else:
              activity = activity[:-1] + ' android:screenOrientation="landscape">'
          manifest = manifest[:match.start()] + activity + manifest[match.end():]
          manifest_path.write_text(manifest)

          activities = list(Path('android/app/src/main').rglob('MainActivity.java'))
          if len(activities) != 1:
              raise SystemExit(f'Expected one Capacitor MainActivity.java, found {len(activities)}.')
          activity_path = activities[0]
          source = activity_path.read_text()
          if 'applyP27ImmersiveFullscreen' not in source:
              package_end = source.find(';')
              if not source.lstrip().startswith('package ') or package_end < 0:
                  raise SystemExit('Unexpected MainActivity.java package declaration.')
              imports = '''
          import android.os.Bundle;
          import android.os.Build;
          import android.view.View;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          '''
              source = source[:package_end + 1] + imports + source[package_end + 1:]
              methods = '''
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  applyP27ImmersiveFullscreen();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) applyP27ImmersiveFullscreen();
              }

              private void applyP27ImmersiveFullscreen() {
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      WindowManager.LayoutParams params = getWindow().getAttributes();
                      params.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(params);
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      WindowInsetsController controller = getWindow().getInsetsController();
                      if (controller != null) {
                          controller.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                          controller.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                      }
                  } else {
                      int flags = View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_FULLSCREEN;
                      getWindow().getDecorView().setSystemUiVisibility(flags);
                  }
              }
          '''
              source = source.rstrip()
              if not source.endswith('}'):
                  raise SystemExit('Unexpected MainActivity.java class ending.')
              source = source[:-1] + methods + '\n}\n'
              activity_path.write_text(source)
          else:
              print('P27 immersive fullscreen already configured.')

          check = activity_path.read_text()
          for token in ('applyP27ImmersiveFullscreen', 'WindowInsets.Type.statusBars()', 'WindowInsets.Type.navigationBars()', 'BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE', 'WindowCompat.setDecorFitsSystemWindows(getWindow(), false)'):
              if token not in check:
                  raise SystemExit(f'Missing immersive fullscreen token: {token}')
          if 'android:screenOrientation="landscape"' not in manifest_path.read_text():
              raise SystemExit('Landscape orientation not enforced in AndroidManifest.xml.')
          print('P27 Android app: landscape locked, system bars hidden, edge-to-edge cutout layout enabled.')
          PY
      - name: Build debug APK (retry transient Maven rate limits)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Android build attempt $attempt/3"
            if (cd android && ./gradlew --no-daemon --max-workers=2 assembleDebug); then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle dependency resolution failed; waiting before retry."
              sleep $((attempt * 30))
            fi
          done
          echo "Android build failed after three attempts."
          exit 1
      - name: Verify APK output
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: football-rp-online-p27-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
