name: P27 Android test APK

on:
  push:
    branches: [p27-dev, p27-apk-build, p27-dls-inspired-redesign]
  pull_request:
    branches: [p27-dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build offline Android test APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout P27 development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK platform and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Run P27 automated tests
        run: npm test
      - name: Bundle the game and local 3D assets
        run: npm run build
      - name: Generate the Android project
        run: npx cap add android
      - name: Synchronize bundled web application
        run: npx cap sync android
      - name: Force landscape orientation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          manifest = path.read_text()
          if 'android:screenOrientation=' not in manifest:
              manifest = manifest.replace('<activity', '<activity android:screenOrientation="landscape"', 1)
          elif 'android:screenOrientation="landscape"' not in manifest:
              raise SystemExit('Unexpected screen orientation already configured; refusing to overwrite it.')
          path.write_text(manifest)
          PY
      - name: Build debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug
      - name: Verify APK output
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: football-rp-online-p27-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
