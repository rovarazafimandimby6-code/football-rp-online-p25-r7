
name: Football RP Online - Android Build

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Download P25 R7 archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v25-r7 \
            --repo rovarazafimandimby6-code/football-rp-online-p25-r7 \
            --pattern "Football-RP-Online-P25-R7.zip"

      - name: Extract project
        run: |
          unzip Football-RP-Online-P25-R7.zip -d project

      - name: Check project
        run: |
          find project -name package.json
          find project -name index.html
          
