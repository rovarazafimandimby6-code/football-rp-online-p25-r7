name: P27 validation
on:
  push:
    branches: [p27-dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p27-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run automated tests
        run: npm test
      - name: Apply D1 migrations against local SQLite
        run: |
          npx --yes wrangler@4 d1 migrations apply p27-world --local
          npx --yes wrangler@4 d1 execute p27-world --local --command "PRAGMA foreign_key_check;"
      - name: Build Cloudflare Worker without deploying
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/p27-cloudflare-worker
      - name: Test player identity routes against local D1
        run: bash scripts/test-cloudflare-local.sh
      - name: Validate deployment preflight command
        env:
          P27_ADMIN_TOKEN: p27-ci-only-dummy-secret-not-for-production-0123456789
        run: npm run preflight
      - name: Check JavaScript and shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find src server tests scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print)
          bash -n scripts/test-cloudflare-local.sh
